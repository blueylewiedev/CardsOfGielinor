name: Check cards

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Every card loads (its tags are in core/cards.lua)
        run: lua5.4 dev/check_cards.lua
      - name: Parked cards are still sound and not in the deck (dev/parked_cards/)
        run: lua5.4 dev/check_parked.lua
      - name: Collections save and load (core/storage.lua)
        run: lua5.4 dev/check_storage.lua
      - name: JSON decoder (core/json.lua)
        run: lua5.4 dev/check_json.lua
      - name: Cards can be added, replaced and retired (core/cards.lua)
        run: lua5.4 dev/check_registry.lua
      - name: Card weights and the pick inside a rarity (core/packs.lua)
        run: lua5.4 dev/check_packs.lua
      - name: Slayer credits and XP credits (core/slayer.lua, core/earning.lua)
        run: lua5.4 dev/check_slayer.lua
      - name: Boss kill credits (core/bosses.lua)
        run: lua5.4 dev/check_bosses.lua
      - name: The tuning keys, their limits and what reads them (core/config.lua)
        run: lua5.4 dev/check_config.lua
      - name: docs/tuning.json is accepted whole by the plugin (core/config.lua)
        run: lua5.4 dev/check_tuning.lua
      - name: The deck survives the overlay format (dev/export_overlay.lua)
        run: lua5.4 dev/check_overlay.lua
      - name: Overlay build logic (dev/build_overlay.py)
        run: python3 dev/test_build_overlay.py
      - name: Overlay applying and fetching (core/overlay.lua, core/overlayloader.lua)
        run: lua5.4 dev/check_loader.lua
      - name: Plugin version matches plugin.json (core/version.lua)
        run: lua5.4 dev/check_version.lua
      - name: Quiet console, failures logged once (core/logger.lua)
        run: lua5.4 dev/check_logger.lua
      - name: Collection viewer search, filters and sorts (core/browse.lua)
        run: lua5.4 dev/check_viewer.lua
      - name: Collection viewer controls against a stand-in client (ui/viewer.lua)
        run: lua5.4 dev/check_viewer_ui.lua
      - name: Sets hold real cards and their rules work (deck/sets.lua, core/sets.lua)
        run: lua5.4 dev/check_sets.lua
      - name: Sets window controls against a stand-in client (ui/setsviewer.lua)
        run: lua5.4 dev/check_sets_ui.lua
      - name: The Shop's sections, titles, divider and tiles (ui/shoplayout.lua)
        run: lua5.4 dev/check_shop_layout.lua
      - name: The credits text (core/format.lua)
        run: lua5.4 dev/check_format.lua
      - name: The performance probe's frame numbers (dev/framestats.lua)
        run: lua5.4 dev/check_framestats.lua
      - name: Release package is clean (dev/build_release.py)
        run: python3 dev/test_build_release.py
