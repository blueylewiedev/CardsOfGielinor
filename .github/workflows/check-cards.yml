name: Check cards

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Every card loads (its tags are in core/cards.lua)
        run: lua5.4 dev/check_cards.lua
