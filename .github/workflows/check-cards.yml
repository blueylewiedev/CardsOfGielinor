name: Check cards

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Every card loads (its tags are in core/cards.lua)
        run: lua5.4 dev/check_cards.lua
      - name: Collections save and load (core/storage.lua)
        run: lua5.4 dev/check_storage.lua
      - name: JSON decoder (core/json.lua)
        run: lua5.4 dev/check_json.lua
      - name: Cards can be added, replaced and retired (core/cards.lua)
        run: lua5.4 dev/check_registry.lua
      - name: The deck survives the overlay format (dev/export_overlay.lua)
        run: lua5.4 dev/check_overlay.lua
      - name: Overlay build logic (dev/build_overlay.py)
        run: python3 dev/test_build_overlay.py
      - name: Overlay applying and fetching (core/overlay.lua, core/overlayloader.lua)
        run: lua5.4 dev/check_loader.lua
      - name: Plugin version matches plugin.json (core/version.lua)
        run: lua5.4 dev/check_version.lua
      - name: Release package is clean (dev/build_release.py)
        run: python3 dev/test_build_release.py
